<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://gimbal-view.fly.dev/" />
    <title>Gimbal documentation moved</title>

      const path = location.pathname.replace(/^\/gimbal(?=\/|$)/, "") || "/";

    </script>
  </head>

  </body>
