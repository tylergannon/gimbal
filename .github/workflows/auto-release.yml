name: Automatic release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release source
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Select validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            # Compare with delivered code, so coalesced pushes cannot hide changes.
            base="$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          go run ./internal/automation/ci-scope --base "$base" >> "$GITHUB_OUTPUT"
      - name: Check instruction links
        run: go run ./internal/automation/ci-scope --check-links
      - name: Select Go test prerequisites
        id: prerequisites
        if: github.event_name == 'pull_request' && steps.scope.outputs.go_packages != '[]'
        run: go run ./internal/automation/ci-scope --go-prerequisites >> "$GITHUB_OUTPUT"
      # Vite+ owns Node and package-manager setup; subsequent commands use vp.
      - uses: voidzero-dev/setup-vp@v1.21.2
        if: steps.scope.outputs.release == 'true'
        with:
          working-directory: web
          node-version: '24'
          run-install: false
          cache: ${{ github.event_name == 'pull_request' && (steps.scope.outputs.web == 'true' || steps.prerequisites.outputs.web_assets == 'true') }}
      - uses: golangci/golangci-lint-action@v9.3.0
        if: steps.scope.outputs.release == 'true'
        with:
          version: v2.14.0
          install-only: true
      - name: Check release automation and hooks
        if: steps.scope.outputs.release == 'true'
        run: bash scripts/check-automation.sh
      - name: Build assets consumed by affected Go tests
        if: github.event_name == 'pull_request' && steps.prerequisites.outputs.web_assets == 'true'
        run: |
          cd web
          vp install --frozen-lockfile
          vp build
          test -s build/skgo.manifest.json
      - name: Install workflow runtime shell for affected Go tests
        if: github.event_name == 'pull_request' && steps.scope.outputs.go_packages != '[]'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check affected Go packages on PRs
        if: github.event_name == 'pull_request' && steps.scope.outputs.go_packages != '[]'
        run: go run ./internal/automation/ci-scope --run-go
      - name: Prepare affected frontend tests
        if: github.event_name == 'pull_request' && steps.scope.outputs.web == 'true'
        run: |
          cd web
          vp install --frozen-lockfile
          vp exec playwright install --with-deps chromium
      - name: Check frontend units on PRs
        if: github.event_name == 'pull_request' && steps.scope.outputs.web == 'true'
        run: cd web && vp run test

  release:
    name: Tag and publish checked source
    needs: check
    if: needs.check.outputs.release == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    environment: release-preparation
    permissions:
      contents: read
      actions: write
    steps:
      - name: Fetch release publisher from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = gimbal && test "$CONFIG" = stg
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ steps.doppler.outputs.RELEASE_TAG_SSH_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Prepare next patch release
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: go run ./internal/automation/prepare-release "$SOURCE_SHA"
      - name: Dispatch tagged build and wait for publication
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: go run ./internal/automation/dispatch-release "$TAG" "$RELEASE_SHA" "$REPOSITORY"
