name: Automatic release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep publication ordered. Pending pushes coalesce into the latest main revision.
concurrency:
  group: automatic-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release source
    # The preparation key triggers pushes; its changelog-only commit is already checked.
    if: >-
      github.event_name != 'push' ||
      github.event.head_commit.author.name != 'github-actions[bot]' ||
      !contains(github.event.head_commit.message, 'Release-Source: ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v4
      - name: Install workflow runtime shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check release automation
        run: python3 -m unittest discover -s scripts -p '*release_test.py' -v
      - name: Check staged-file hooks
        run: just check-hooks
      - name: Build application
        run: just build
      - name: Check built CLI protocols and argument routing
        run: just check-cli-release
      - name: Install browser test runtime
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Install Go analysis tool
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Check application
        run: |
          just lint-go
          just vet
          just test
          just fmt-check
          just check-web

  release:
    name: Tag and publish checked source
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    environment: release-preparation
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
      - name: Set release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare next patch release
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-release.py "$SOURCE_SHA"
      - name: Dispatch tagged build and wait for publication
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/dispatch-release.py "$TAG" "$RELEASE_SHA" "$REPOSITORY"
