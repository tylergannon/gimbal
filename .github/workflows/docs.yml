name: Redirect old documentation URLs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://gimbal-view.fly.dev/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .github/pages/index.html .github/pages/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .github/pages
      - uses: actions/deploy-pages@v4
