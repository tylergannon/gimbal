name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check generated workflow diagrams
        run: |
          go generate ./internal/workflows/review ./internal/workflows/validateproduct ./internal/workflows/implementation ./internal/workflows/researchdocument ./internal/workflows/pyramidsummary
          git diff --exit-code
      - run: pnpm install --frozen-lockfile
        working-directory: docs-site
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: pnpm run check
        working-directory: docs-site
      - run: pnpm run build
        working-directory: docs-site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
