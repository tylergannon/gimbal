name: Import release secrets into Doppler

on:
  workflow_dispatch:
    inputs:
      source:
        description: GitHub environment secret group to copy to gimbal/stg
        required: true
        type: choice
        options: [preparation, release]

permissions:
  contents: read

concurrency:
  group: doppler-secret-import
  cancel-in-progress: false

jobs:
  copy:
    if: >-
      (inputs.source == 'preparation' && github.ref == 'refs/heads/main') ||
      (inputs.source == 'release' && github.ref_type == 'tag')
    environment: ${{ inputs.source == 'preparation' && 'release-preparation' || 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy and verify existing environment secrets
        env:
          SOURCE_GROUP: ${{ inputs.source }}
          DOPPLER_IMPORT_TOKEN: ${{ secrets.DOPPLER_TOKEN_RW }}
          RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: python3 scripts/copy-secrets-to-doppler.py "$SOURCE_GROUP"
