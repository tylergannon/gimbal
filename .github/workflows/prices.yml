name: Refresh model prices

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-prices-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: taiki-e/install-action@just
      - name: Refresh generated prices
        run: just prices
      - name: Open catalog refresh for model review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main moved while prices were generated; refusing to publish a stale result" >&2
            exit 1
          fi

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "model prices are already current"
            exit 0
          fi
          if [[ "$changed" != "internal/observation/model_prices_gen.go" ]]; then
            echo "generator changed files outside its generated target:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          branch="automation/model-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- internal/observation/model_prices_gen.go
          git commit -m "chore: refresh model prices"
          git push origin "$branch"

          cat > /tmp/model-catalog-pr.md <<'EOF'
          Scheduled models.dev refresh. The commit updates the generated model-price table.

          Before merging, inspect added and removed model IDs. When a newer model changes a family, update the default shorthand and explicit versions in `internal/modelalias/modelalias.go`, every affected built-in role in `cmd/gimble/defaults.json`, other configured defaults, and rendered workflow help or skills. Preserve each role's intended model tier. Do not add assertions that pin a moving shorthand to one version.

          Follow the model-catalog review in `skills/gimble-release/SKILL.md`. Publish a release only after the complete model change is merged and checked; verify a public commit install before tagging and an exact-tag install afterward.
          EOF
          gh pr create --base main --head "$branch" --title "Refresh models.dev catalog and review model defaults" --body-file /tmp/model-catalog-pr.md
