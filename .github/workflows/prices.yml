name: Refresh model catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-prices-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: taiki-e/install-action@just
      - name: Read the Diffusion API key from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOPPLER_TOKEN" ]]; then
            echo "repository secret DOPPLER_TOKEN is not set; add a Doppler service token for the config holding DIFFUSION_API_KEY" >&2
            exit 1
          fi
          key="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $DOPPLER_TOKEN" \
            "https://api.doppler.com/v3/configs/config/secrets/download?format=json" |
            jq -er '.DIFFUSION_API_KEY')"
          echo "::add-mask::$key"
          echo "DIFFUSION_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Refresh generated models, aliases, and prices
        run: just models
      - name: Open catalog refresh for model review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main moved while prices were generated; refusing to publish a stale result" >&2
            exit 1
          fi

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "model prices are already current"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              internal/modelalias/aliases_gen.go|internal/observation/model_prices_gen.go|pi/diffusion_models_gen.go) ;;
              *)
                echo "generator changed a file outside its generated targets: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          branch="automation/model-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- internal/modelalias/aliases_gen.go internal/observation/model_prices_gen.go pi/diffusion_models_gen.go
          git commit -m "chore: refresh model catalog"
          git push origin "$branch"

          cat > /tmp/model-catalog-pr.md <<'EOF'
          Scheduled refresh from models.dev and the Diffusion Router. The commit regenerates the model-price table, the model aliases (haiku, sonnet, opus, fable, luna, terra, sol, astra, gpt, deepseek-flash, glm, glm-flash, glm-vision), and the Diffusion model limits. Each unversioned alias already points at the newest version in the catalog.

          Before merging, inspect added and removed model IDs. Review the built-in role defaults in `internal/builtin/defaults.json` and other configured defaults, help, and skills: they name explicit models and do not follow an alias. Preserve each role's intended model tier. Do not add assertions that pin a moving shorthand to one version.

          Follow the model-catalog review in `skills/gimbal-release/SKILL.md`. Publish a release only after the complete model change is merged and checked; verify a published-commit install before tagging and an exact-tag install afterward, each with its web listener running.
          EOF
          gh pr create --base main --head "$branch" --title "Refresh models.dev catalog and review model defaults" --body-file /tmp/model-catalog-pr.md
