name: Release performance

on:
  workflow_run:
    workflows: [Automatic release]
    branches: [main]
    types: [requested, completed]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

# Serialize incident observation across workflow runs.
concurrency:
  group: release-performance
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always execute trusted main, never code/artifacts supplied by a PR run.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Observe release timing and file advisory issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./internal/automation/release-timing --scan --report /tmp/release-timing.json
      - name: Retain release timing measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-performance-timing
          path: /tmp/release-timing.json
          if-no-files-found: warn
          retention-days: 14

  # No dependency on observe: a release API/record failure cannot skip hourly hooks.
  hook-observe:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Warm smoke-test compiler outside commit timing
        run: python3 scripts/pre-commit.py --warm
      - name: Measure representative hook and file advisory issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/pre-commit.py --benchmark --report /tmp/hook-timing.json
          go run ./internal/automation/release-timing --hook-report /tmp/hook-timing.json
      - name: Retain hook timing measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-performance-timing
          path: /tmp/hook-timing.json
          if-no-files-found: warn
          retention-days: 14
