name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-inputs:
    name: Prepare shared release inputs
    runs-on: [self-hosted, Linux, X64, bob-gimbal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Vite+ owns Node and package-manager setup; subsequent commands use vp.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: web
          node-version: '24'
          run-install: false
          cache: false
      - uses: extractions/setup-just@v4
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Generate source and build frontend once
        run: |
          just build-assets
          go run ./internal/automation/release-assets pack dist/release-inputs.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: dist/release-inputs.tar.gz
          retention-days: 2
          if-no-files-found: error

  linux-cli:
    name: CLI (${{ matrix.target }})
    needs: prepare-inputs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            runner: [self-hosted, Linux, X64, bob-gimbal]
          - target: linux_arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: ${{ matrix.target != 'linux_amd64' }}
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Restore exact-revision generated source and frontend
        run: go run ./internal/automation/release-assets restore dist/release-inputs.tar.gz
      - uses: extractions/setup-just@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 2.18.3
          install-only: true
      - name: Build and package CLI
        env:
          RELEASE_PREPARED_INPUTS: 1
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release-cli.sh "$RELEASE_TARGET"
      - name: Qualify the packaged amd64 binary
        if: matrix.target == 'linux_amd64'
        run: |
          mkdir -p bin
          tar -xzf dist/gimbal_*_linux_amd64.tar.gz -C bin
          just check-cli-release
          ./bin/gimbal lint ./...
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  qualify:
    name: Qualify release source
    needs: prepare-inputs
    runs-on: [self-hosted, Linux, X64, bob-gimbal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Restore exact-revision generated source and frontend
        run: go run ./internal/automation/release-assets restore dist/release-inputs.tar.gz
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: web
          node-version: '24'
          run-install: false
          cache: false
      - uses: extractions/setup-just@v4
      - name: Prepare full qualification prerequisites
        run: |
          cd web
          vp install --frozen-lockfile
          vp exec playwright install --with-deps chromium
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Fully qualify release source alongside platform packaging
        run: |
          just lint-go
          go vet ./...
          just test
          just fmt-check
          just check-web

  macos-release:
    name: Signed and notarized macOS release assets
    needs: prepare-inputs
    env:
      GOMAXPROCS: 4
      GOFLAGS: -p=4
      GIMBAL_BUILD_JOBS: 4
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!inputs.tag || inputs.tag == github.ref_name)
    runs-on: [self-hosted, macOS, ARM64, gimbal-release]
    environment: release
    steps:
      - name: Keep native compiler outputs on this Mac
        run: echo "GIMBAL_DERIVED_DATA=$HOME/Library/Caches/gimbal-release/DerivedData" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          # The persistent Mac already retains its local Go caches.
          cache: false
      - name: Ensure release automation runs without Python
        run: |
          blocked="$RUNNER_TEMP/gimbal-no-python"
          mkdir -p "$blocked"
          for tool in python python3; do
            printf '#!/bin/sh\nprintf "Unexpected Python dependency in release automation.\\n" >&2\nexit 99\n' > "$blocked/$tool"
            chmod +x "$blocked/$tool"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Restore exact-revision generated source and frontend
        run: go run ./internal/automation/release-assets restore dist/release-inputs.tar.gz
      - uses: extractions/setup-just@v4
      - uses: jdx/mise-action@v5.1.2
        with:
          # This persistent Mac retains its tools locally; do not archive/upload them.
          cache: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: web
          node-version: '24'
          run-install: false
          cache: false
      - name: Install metadata dependencies for native Swift bindings
        working-directory: web
        run: vp install --frozen-lockfile
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 2.18.3
          install-only: true
      - name: Fetch signing credentials from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = gimbal && test "$CONFIG" = stg
      - name: Prepare macOS signing and notarization credentials
        env:
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ steps.doppler.outputs.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          MACOS_NOTARY_PROFILE: gimbal-release-notary
        run: scripts/ci-signing.sh setup
      - name: Build, sign, and notarize the macOS CLI
        env:
          RELEASE_PREPARED_INPUTS: 1
          RELEASE_TARGET: darwin_arm64
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: nice -n 10 scripts/release-cli.sh "$RELEASE_TARGET"
      - name: Build, sign, notarize, and staple app
        env:
          RELEASE_PREPARED_INPUTS: 1
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_ED_PRIVATE_KEY: ${{ steps.doppler.outputs.SPARKLE_ED_PRIVATE_KEY }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/native/build/macos/.sdk
        run: nice -n 10 scripts/release-macos.sh --release --version "${RELEASE_VERSION#v}" --build-number "$RELEASE_BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/gimbal_*.tar.gz
            dist/macos/Gimbal-*-macos-arm64.zip
            dist/macos/Gimbal-*-macos-arm64.dmg
            dist/macos/appcast.xml
          if-no-files-found: error
          retention-days: 2
      - if: always()
        name: Remove macOS signing material
        run: scripts/ci-signing.sh cleanup

  publish:
    name: Publish GitHub Release and Homebrew Casks
    needs: [qualify, linux-cli, macos-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist
          merge-multiple: true
      - name: Calculate final artifact checksums
        run: |
          cd dist
          sha256sum -- ./*.tar.gz macos/*.zip macos/*.dmg > checksums.txt
      - name: Fetch Homebrew publisher from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Validate Doppler destination
        env:
          PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
        run: test "$PROJECT" = gimbal && test "$CONFIG" = stg
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              dist/*.tar.gz dist/checksums.txt dist/macos/*.zip dist/macos/*.dmg dist/macos/appcast.xml
            gh release edit "$TAG" --draft=false --latest --title "Gimbal $TAG"
          else
            gh release create "$TAG" --verify-tag --title "Gimbal $TAG" --latest \
              --generate-notes dist/*.tar.gz dist/checksums.txt dist/macos/*.zip dist/macos/*.dmg dist/macos/appcast.xml
          fi
      - uses: actions/checkout@v4
        with:
          repository: tylergannon/homebrew-gimbal
          ref: main
          path: homebrew-tap
          ssh-key: ${{ steps.doppler.outputs.TAP_DEPLOY_KEY }}
      - name: Update Homebrew CLI and app Casks
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          cli_sha="$(awk '/gimbal_.*_darwin_arm64\.tar\.gz$/ {print $1}' dist/checksums.txt)"
          app_sha="$(awk '/Gimbal-.*-macos-arm64\.dmg$/ {print $1}' dist/checksums.txt)"
          test -n "$cli_sha" && test -n "$app_sha"
          scripts/update-homebrew-casks.sh homebrew-tap "$version" "$cli_sha" "$app_sha" "$TAG"
      - name: Report tagged release elapsed time
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-timing.sh
