name: Observe native runner cutover
on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string
      publish:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: [self-hosted, macOS, ARM64, gimbal-release]
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native tools and centrally owned execution
        run: |
          test "$(uname -s)" = Darwin
          test "$GOCACHE" = "$HOME/CI/github-actions-runner/caches/native/go-build"
          case "$GITHUB_WORKSPACE" in "$HOME/CI/github-actions-runner/native/"*) ;; *) exit 1 ;; esac
          xcodebuild -version
          xcrun --find swiftc
          printf 'print("native execution succeeded")\n' > "$RUNNER_TEMP/main.swift"
          swiftc "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/native-runner-check"
          codesign --force --sign - "$RUNNER_TEMP/native-runner-check"
          "$RUNNER_TEMP/native-runner-check"
