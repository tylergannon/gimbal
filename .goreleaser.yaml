version: 2

project_name: gimbal

builds:
  - id: gimbal
    main: ./cmd/gimbal
    binary: gimbal
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=1
    targets:
      # release-cli.sh renders this native target into a temporary config.
      - darwin_arm64
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  - id: gimbal-command
    main: ./cmd/gimbal-command
    binary: gimbal-command
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
    ldflags:
      - -s -w

archives:
  - id: gimbal
    ids: [gimbal, gimbal-command]
    name_template: "gimbal_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: false
  prerelease: auto
