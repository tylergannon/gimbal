# Host Temporal for this compose stack: temporal server start-dev --ip 0.0.0.0
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gimbal
      POSTGRES_PASSWORD: gimbal
      POSTGRES_DB: gimbal
    ports:
      - "5433:5432"
    volumes:
      - gimbal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimbal -d gimbal"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  gimbal-postgres:
