<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gimbal · Workflow source</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fafbf9;
        --surface: #fff;
        --ink: #22302a;
        --muted: #5b6861;
        --line: #d8e0d9;
        --wash: #f0f4ef;
        --fill: #f0f4ef99;
        --fill-cond: #f6f3ee99;
        --accent: #5d4a8f;
        --tint: #eee8f8;
        --write: #3f7052;
        --write-line: #7ca08a;
        --edge: #6f7f73;
        --amber: #7f5412;
        --amber-bg: #fbf5e8;
        --amber-line: #eadbbc;
        --key: #4a5c4d;
        --node-width: 180px;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #191d1c;
          --surface: #232827;
          --ink: #edf2ed;
          --muted: #acb8b0;
          --line: #465149;
          --wash: #2b342e;
          --fill: #2b342e80;
          --fill-cond: #3d352650;
          --accent: #c9b7ef;
          --tint: #393048;
          --write: #9cc8ac;
          --write-line: #6f9a7f;
          --edge: #96a69a;
          --amber: #d4b57c;
          --amber-bg: #3d3526;
          --amber-line: #615234;
          --key: #b2c9ba;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      code {
        font: 12px/1.6 var(--mono);
      }
      .pagehead {
        padding: 16px 24px 14px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.02em;
        margin: 0;
        font-weight: 600;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .dot.write {
        background: var(--write);
      }
      .dot.flow {
        background: var(--edge);
      }
      .workspace {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(360px, 30vw, 440px);
      }
      .map-scroll {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        position: relative;
        border-right: 1px solid var(--line);
      }
      @media (prefers-reduced-motion: no-preference) {
        .map-scroll {
          scroll-behavior: smooth;
        }
      }
      .map {
        position: relative;
        min-width: 100%;
        width: max-content;
        padding: 28px 16px 60px;
      }
      .graph-body {
        position: relative;
      }
      .connections {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 1;
      }
      .connections path {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.6;
      }
      .sequence {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        min-width: var(--node-width);
      }
      .step {
        width: var(--node-width);
        position: relative;
      }
      .node {
        display: block;
        width: var(--node-width);
        min-height: 46px;
        padding: 8px 12px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        text-align: left;
        background: var(--surface);
        box-shadow: 0 2px 3px #26312808;
        position: relative;
        z-index: 2;
      }
      .node:hover {
        background: var(--wash);
      }
      .node strong {
        display: block;
        font-size: 13px;
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .node[data-kind="Set"] strong,
      .node[data-kind="SetJSON"] strong {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .node small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .node .op {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 1px;
      }
      .node .code,
      .node small.code {
        font: 12px/1.45 var(--mono);
      }
      .node[data-kind="Generate"] {
        border-left: 3px solid var(--accent);
      }
      .node[data-kind="Set"],
      .node[data-kind="SetJSON"] {
        border-left: 3px solid var(--write-line);
      }
      .node[data-control] strong {
        white-space: normal;
        overflow-wrap: anywhere;
        font: 12px/1.45 var(--mono);
        font-weight: 500;
      }
      .node[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--tint);
        box-shadow: 0 0 0 2px #65509a30;
      }
      .node.origin {
        box-shadow: 0 0 0 2px var(--write-line);
      }
      .block {
        width: max-content;
        min-width: calc(var(--node-width) + 20px);
        padding: 10px 10px 12px;
        background: var(--fill);
        border: 1px solid var(--line);
        border-radius: 10px;
        position: relative;
      }
      .block[data-kind="Condition"] {
        background: var(--fill-cond);
      }
      .block[data-kind="Repeat"],
      .block[data-kind="Iterate"],
      .block[data-kind="PromiseLoop"] {
        border-style: dashed;
      }
      .block > .node {
        margin: 0 auto;
      }
      .lanes {
        display: flex;
        gap: 12px;
        justify-content: center;
        padding-top: 24px;
      }
      .lane {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        min-width: var(--node-width);
      }
      .lane.through {
        min-width: 0;
      }
      .lane.through > .branch {
        font-family: inherit;
        padding-inline: 3px;
      }
      .branch,
      .action {
        max-width: var(--node-width);
        padding: 4px 9px;
        font: 11px/1.45 var(--mono);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow-wrap: anywhere;
        position: relative;
        z-index: 2;
      }
      .action {
        border-style: dashed;
        color: var(--muted);
      }
      .join {
        height: 8px;
        width: 8px;
        border: 1.6px solid var(--edge);
        border-radius: 50%;
        margin: 22px auto 0;
        background: var(--paper);
        position: relative;
        z-index: 2;
      }
      .inspection {
        min-height: 0;
        overflow: auto;
        background: var(--surface);
        padding: 20px 24px 48px;
      }
      .panel-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .back {
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        padding: 3px 9px;
        color: var(--muted);
      }
      .back:hover {
        background: var(--wash);
      }
      .inspection h2 {
        font-size: 19px;
        font-weight: 600;
        line-height: 1.35;
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      .inspection h2.code {
        font: 17px/1.4 var(--mono);
        font-weight: 500;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-bottom: 4px;
      }
      .hint {
        overflow-wrap: anywhere;
      }
      .meta code {
        color: var(--muted);
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .section {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 14px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }
      .badge {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 7px;
      }
      .prompt {
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 8px 0 0;
        border-left: 2px solid var(--accent);
        padding-left: 14px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 6px 0 8px;
      }
      .warning {
        font-size: 12px;
        color: var(--amber);
        padding: 9px 11px;
        background: var(--amber-bg);
        border: 1px solid var(--amber-line);
        border-radius: 6px;
        margin: 10px 0;
      }
      pre.code {
        font: 12px/1.65 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--wash);
        padding: 12px;
        border-radius: 6px;
        margin: 8px 0;
      }
      .branches {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
      }
      .branches li {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: baseline;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .branches code {
        color: var(--ink);
      }
      .shape {
        font: 13px/1.55 var(--mono);
        overflow-wrap: anywhere;
      }
      .go-detail { display: none; }
      .show-go-types .go-detail {
        display: inline;
        color: var(--muted);
        font-size: 11px;
        margin-left: 8px;
      }
      .type-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .type-toggle input { margin: 0; }
      .shape .brace {
        color: var(--muted);
      }
      .shape details {
        padding-left: 16px;
      }
      .shape summary {
        cursor: pointer;
        list-style-position: outside;
      }
      .shape .leaf {
        padding-left: 16px;
      }
      .key {
        color: var(--key);
      }
      .type {
        color: var(--accent);
      }
      .shape .shape-note {
        font: 11px/1.5 -apple-system, sans-serif;
        color: var(--amber);
        margin: 2px 0 6px;
        padding-left: 16px;
      }
      .origin-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font: 11px/1.5 -apple-system, sans-serif;
        margin: 0 0 3px;
        color: var(--muted);
      }
      .origin-row code {
        font-size: 11px;
      }
      .origin-link {
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 2px;
        font: inherit;
      }
      .status {
        color: var(--muted);
      }
      .context-entry {
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .steps {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
      }
      .steps li {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: baseline;
        font-size: 13px;
      }
      .steps .origin-link {
        font-weight: 550;
      }
      .steps small {
        color: var(--muted);
        font-size: 12px;
      }
      .details {
        font-size: 12px;
        color: var(--muted);
        margin-top: 20px;
      }
      .details summary {
        cursor: pointer;
      }
      .details ul {
        padding-left: 18px;
      }
      .details li {
        margin: 8px 0;
      }
      @media (max-width: 850px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr);
        }
        .pagehead {
          padding: 14px 16px;
        }
        .inspection {
          padding: 16px;
        }
        .map {
          padding: 20px;
        }
      }
      @media (max-width: 640px) {
        body {
          height: auto;
          display: block;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .map-scroll {
          height: 52vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .inspection {
          overflow: visible;
        }
        .pagehead {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header class="pagehead">
      <div>
        <h1 id="title"></h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="legend" aria-label="Legend">
        <span><i class="dot"></i>Generate</span>
        <span><i class="dot write"></i>Context write</span>
        <span><i class="dot flow"></i>Flow</span>
      </div>
    </header>
    <main class="workspace">
      <section class="map-scroll" id="map-scroll" aria-label="Workflow graph">
        <div class="map" id="map">
          <svg class="connections" id="connections" aria-hidden="true"></svg>
          <div class="graph-body" id="graph-body"></div>
        </div>
      </section>
      <aside
        class="inspection"
        id="inspection"
        aria-label="Selected step"
      ></aside>
    </main>
    <script id="source-data" type="application/json">
      "SOURCE_DATA_PLACEHOLDER"
    </script>
    <script>
      "use strict";
      const data = JSON.parse(
        document.getElementById("source-data").textContent,
      );
      const byId = new Map(),
        elements = new Map();
      const el = (tag, cls, txt) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (txt !== undefined) e.textContent = txt;
        return e;
      };
      const text = (parent, tag, cls, txt) => {
        const e = el(tag, cls, txt);
        parent.append(e);
        return e;
      };
      const basename = (f) => f.split("/").pop();
      const leaf = (scope) => scope.split("/").pop();

      // Kind names as a reader sees them. Gimbal's own call names stay.
      const kindNames = {
        NewSession: "New session",
        PromiseLoop: "Promise loop",
        Repeat: "Loop",
        Go: "Go",
      };
      const kindName = (n) => {
        if (n.kind === "Condition")
          return n.control?.code?.startsWith("switch") ? "Switch" : "If";
        return kindNames[n.kind] || n.kind;
      };
      // The statement's own first line is the title of a condition or loop.
      const headline = (n) =>
        n.control?.code
          ? n.control.code.split("\n")[0].replace(/\s*\{\s*$/, "")
          : n.kind === "Repeat"
            ? "for " + n.label
            : n.label;
      const isElse = (label) => label === "else / default";
      // The branch taken when no case matches, in the statement's own word.
      const otherwise = (n) =>
        n.control?.code?.startsWith("switch") ? "default" : "else";
      const dynamicKey = (n) =>
        (n.kind === "Set" || n.kind === "SetJSON") &&
        n.detail &&
        !n.detail.keyKnown;
      const title = (n) => {
        if (n.control) return headline(n);
        if (dynamicKey(n)) return "[" + n.detail.keyExpression + "]";
        return n.label || n.kind;
      };
      // A guard: one branch with no steps that leaves. It is one line of
      // source and draws as one card; flow continues when the test is false.
      const isGuard = (n) =>
        n.kind === "Condition" &&
        kindName(n) !== "Switch" &&
        n.children.length === 1 &&
        n.children[0].length === 0 &&
        n.branchExits?.[0] &&
        !isElse(n.branchLabels[0]);
      const action = (n, i) => n.control?.actions?.[i] || "";

      document.title = "Gimbal · " + data.name;
      document.getElementById("title").textContent = data.name;
      document.getElementById("subtitle").textContent =
        data.entry + " · " + data.source.file;

      function nodeButton(n) {
        byId.set(n.id, n);
        const b = el("button", "node");
        b.dataset.id = n.id;
        b.dataset.kind = n.kind;
        if (n.control) b.dataset.control = "";
        b.setAttribute("aria-pressed", "false");
        b.title = title(n) + " · " + n.source.file + ":" + n.source.line;
        text(b, "span", "op", kindName(n));
        text(b, "strong", dynamicKey(n) ? "code" : "", title(n));
        if (n.kind === "Generate") text(b, "small", "", n.session);
        if (isGuard(n))
          text(b, "small", "code", action(n, 0) || "leaves");
        b.onclick = () => select(n.id);
        elements.set(n.id, b);
        return b;
      }
      function renderSequence(nodes) {
        const seq = el("div", "sequence");
        for (const n of nodes) {
          let wrap;
          if (n.children && !isGuard(n)) {
            wrap = el("div", "block");
            wrap.dataset.kind = n.kind;
            wrap.dataset.id = n.id;
            wrap.append(nodeButton(n));
            const lanes = el("div", "lanes");
            const cond = n.kind === "Condition";
            const labelled = cond && (n.children.length > 1 || kindName(n) === "Switch");
            n.children.forEach((body, i) => {
              const lane = el("div", "lane");
              if (!body.length) lane.classList.add("through");
              if (labelled) {
                const l = n.branchLabels[i];
                text(lane, "div", "branch", isElse(l) ? otherwise(n) : l);
              }
              if (body.length) lane.append(renderSequence(body));
              if (n.branchExits?.[i])
                text(lane, "div", "action", action(n, i) || "leaves");
              lanes.append(lane);
            });
            if (cond && !n.branchLabels.some(isElse)) {
              const lane = el("div", "lane through");
              text(lane, "div", "branch", otherwise(n));
              lanes.append(lane);
            }
            wrap.append(lanes, el("div", "join"));
          } else {
            wrap = el("div", "step");
            wrap.dataset.id = n.id;
            wrap.append(nodeButton(n));
          }
          seq.append(wrap);
        }
        return seq;
      }
      document.getElementById("graph-body").append(renderSequence(data.body));

      // Series/parallel layout: CSS measures the subgraphs; edges connect their
      // entry and exit points. Geometry is recomputed on resize, never on
      // selection.
      function drawEdges() {
        const map = document.getElementById("map"),
          svg = document.getElementById("connections"),
          base = map.getBoundingClientRect();
        svg.replaceChildren();
        svg.setAttribute("width", map.offsetWidth);
        svg.setAttribute("height", map.offsetHeight);
        const point = (e, bottom) => {
          const r = e.getBoundingClientRect();
          return {
            x: r.left - base.left + r.width / 2,
            y: (bottom ? r.bottom : r.top) - base.top,
          };
        };
        function edge(a, b, bend = (a.y + b.y) / 2) {
          const p = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          p.setAttribute(
            "d",
            "M " + a.x + " " + a.y + " V " + bend + " H " + b.x + " V " + b.y,
          );
          svg.append(p);
        }
        const entry = (w) => w.querySelector(":scope > .node");
        const end = (w) => w.querySelector(":scope > .join") || entry(w);
        for (const seq of map.querySelectorAll(".sequence")) {
          const ws = [...seq.children];
          for (let i = 1; i < ws.length; i++)
            edge(point(end(ws[i - 1]), true), point(entry(ws[i]), false));
        }
        for (const block of map.querySelectorAll(".block")) {
          const head = entry(block),
            join = block.querySelector(":scope > .join");
          for (const lane of block.querySelector(":scope > .lanes").children) {
            let prev = head;
            for (const c of lane.children) {
              if (c.classList.contains("sequence")) {
                edge(point(prev, true), point(entry(c.firstElementChild), false));
                prev = end(c.lastElementChild);
              } else {
                edge(point(prev, true), point(c, false));
                prev = c;
              }
            }
            if (!lane.querySelector(":scope > .action")) {
              const endPoint = point(join, false);
              // Join below every sibling body, keeping short bypasses clear.
              edge(point(prev, true), endPoint, endPoint.y - 11);
            }
          }
        }
      }

      function section(parent, heading, badge) {
        const s = el("section", "section"),
          h = el("div", "section-head");
        text(h, "h3", "", heading);
        if (badge) text(h, "span", "badge", badge);
        s.append(h);
        parent.append(s);
        return s;
      }
      let showGoTypes = false;
      function typeToggle(section) {
        const label = el("label", "type-toggle"), input = el("input");
        input.type = "checkbox";
        input.checked = showGoTypes;
        input.onchange = () => {
          showGoTypes = input.checked;
          document.body.classList.toggle("show-go-types", showGoTypes);
        };
        label.title = "Show exact Go types and JSON tags";
        label.append(input, el("span", "", "Go types"));
        section.querySelector(".section-head").append(label);
      }
      function shape(parent, s, key, open = false, optional = false, tag = "", refs = new Map(), path = String(key ?? "value")) {
        if (!s) {
          text(parent, "div", "shape-note", "Type unavailable");
          return;
        }
        const goType = s.type;
        let pointerDepth = 0;
        while (s.kind === "pointer" && s.element) {
          pointerDepth++;
          s = { ...s.element, note: s.note || s.element.note };
        }
        const nullable = !s.goOnly && pointerDepth > 0 && (!optional || pointerDepth > 1);
        const prefix = key === undefined ? "" : JSON.stringify(key) + (optional ? "?" : "") + ": ";
        const types = new Map(refs);
        const typeName = (t) => t?.replace(/^\*+/, "");
        const simple = (v) => {
          if (v.kind === "reference") return "↩ " + (types.get(typeName(v.type)) || v.type);
          if (v.kind === "object") return "{}";
          if (v.kind === "array") return "[" + simple(v.element) + "]";
          if (v.kind === "map") return "{ [key]: " + simple(v.element) + " }";
          if (v.kind === "pointer") return simple(v.element) + " | null";
          return v.type;
        };
        let fields = s.fields;
        let childPath = path;
        if ((s.kind === "array" || s.kind === "map") && s.element?.kind === "object") {
          fields = s.element.fields;
          childPath = path + (s.kind === "array" ? "[]" : "[key]");
          types.set(typeName(s.element.type), childPath);
        }
        if (s.kind === "object") types.set(typeName(s.type), path);
        const expandable = fields?.length || ((s.kind === "array" || s.kind === "map") && ["array", "map", "pointer"].includes(s.element?.kind));
        const row = el(expandable ? "details" : "div", expandable ? "shape-container" : "leaf");
        const head = expandable ? el("summary") : row;
        if (expandable) { row.open = open; row.append(head); }
        head.title = "Go type: " + goType + (tag ? " · JSON tag: " + tag : "") + (optional ? " · Optional field" : "");
        text(head, "span", "key", prefix);
        text(head, "span", "type", simple(s) + (nullable ? " | null" : ""));
        const extra = [];
        if (!goType.includes("struct{") && (goType !== simple(s) || fields)) extra.push(goType);
        if (tag) extra.push('json:"' + tag + '"');
        if (extra.length) text(head, "span", "go-detail", " · " + extra.join(" · "));
        if (fields) {
          for (const f of fields)
            shape(row, f.shape, f.name, false, f.optional, f.tag, types, childPath + "." + f.name);
        } else if (expandable) {
          shape(row, s.element, undefined, true, false, "", types, childPath + "[]");
        }
        parent.append(row);
        if (s.note) text(parent, "div", "shape-note", s.note);
        if (s.element?.note && s.element.note !== s.note)
          text(parent, "div", "shape-note", s.element.note);
      }
      function hasOptionalField(s) {
        return s?.fields?.some((f) => f.optional || hasOptionalField(f.shape)) || (s?.element && hasOptionalField(s.element));
      }
      function reveal(id) {
        const b = elements.get(id);
        if (b)
          b.scrollIntoView({
            behavior: "instant",
            block: "center",
            inline: "center",
          });
      }
      function origin(parent, id, label) {
        const n = byId.get(id);
        const b = text(
          parent,
          "button",
          "origin-link",
          label || kindName(n) + " · line " + n.source.line,
        );
        b.onclick = () => {
          select(id);
          reveal(id);
        };
      }
      function pressed(id) {
        for (const [key, b] of elements) {
          b.setAttribute("aria-pressed", String(key === id));
          b.classList.remove("origin");
        }
      }
      function notes(panel) {
        if (!data.diagnostics.length) return;
        const d = el("details", "details");
        text(
          d,
          "summary",
          "",
          "Analysis gaps (" + data.diagnostics.length + ")",
        );
        const ul = el("ul");
        for (const g of data.diagnostics)
          text(
            ul,
            "li",
            "",
            g.source.file + ":" + g.source.line + " — " + g.message,
          );
        d.append(ul);
        panel.append(d);
      }
      // The overview: the workflow's Generate calls in source order, which is
      // also the page's table of contents.
      function overview() {
        pressed(null);
        const panel = document.getElementById("inspection");
        panel.replaceChildren();
        panel.scrollTop = 0;
        text(panel, "div", "eyebrow", "Workflow");
        text(panel, "h2", "", data.name);
        const meta = text(panel, "div", "meta");
        text(meta, "span", "", data.entry);
        text(meta, "code", "", data.source.file + ":" + data.source.line);
        const calls = [...byId.values()].filter((n) => n.kind === "Generate");
        const s = section(
          panel,
          "Generate calls",
          calls.length + " in source order",
        );
        text(
          s,
          "div",
          "hint",
          "Select a step on the graph, or a call here, to read its prompt and the context it can see.",
        );
        const ul = el("ul", "steps");
        for (const n of calls) {
          const li = el("li");
          origin(li, n.id, n.label);
          const where =
            n.session + (leaf(n.scope) === "root" ? "" : " · " + leaf(n.scope));
          text(li, "small", "", where);
          ul.append(li);
        }
        s.append(ul);
        notes(panel);
      }
      function select(id) {
        const n = byId.get(id);
        if (!n) return;
        pressed(id);
        for (const f of n.context || [])
          elements.get(f.write)?.classList.add("origin");
        const panel = document.getElementById("inspection");
        panel.replaceChildren();
        panel.scrollTop = 0;
        const top = el("div", "panel-top");
        text(top, "div", "eyebrow", kindName(n));
        const back = text(top, "button", "back", "All steps");
        back.onclick = overview;
        panel.append(top);
        text(panel, "h2", n.control || dynamicKey(n) ? "code" : "", title(n));
        const meta = text(panel, "div", "meta");
        text(meta, "code", "", basename(n.source.file) + ":" + n.source.line);
        if (n.session) text(meta, "span", "", "Session " + n.session);
        if (n.from) text(meta, "span", "", "Fork of " + n.from);
        if (n.scope !== "root") text(meta, "span", "", "In " + n.scope);
        if (n.detail && !n.detail.contextKnown)
          text(panel, "div", "warning", n.note);
        else if (n.note) text(panel, "div", "hint", n.note);
        if (n.kind === "Generate") {
          const known = n.detail?.promptKnown;
          const s = section(panel, "Prompt", known ? "Constant" : "Expression");
          if (known) text(s, "div", "prompt", n.prompt);
          else {
            text(
              s,
              "div",
              "hint",
              "The text is built when the workflow runs. This is the Go expression that builds it.",
            );
            text(s, "pre", "code", n.detail?.promptExpression || "Unavailable");
          }
        }
        if (n.kind === "Set" || n.kind === "SetJSON") {
          const s = section(panel, "Value", n.kind);
          if (!n.context) typeToggle(s);
          if (dynamicKey(n)) {
            const h = text(
              s,
              "div",
              "hint",
              "The key is computed when the workflow runs, from ",
            );
            text(h, "code", "", n.detail.keyExpression);
            h.append(". No literal key is known.");
          }
          text(s, "pre", "code", n.detail?.valueExpression || "");
          if (!n.context) {
            const tree = el("div", "shape");
            shape(tree, n.detail?.shape, title(n), true);
            s.append(tree);
            if (hasOptionalField(n.detail?.shape))
              text(s, "div", "hint shape-legend", "? optional field · ↩ refers to an enclosing shape");
          }
        }
        if (n.kind === "Condition" && !isGuard(n)) {
          const s = section(panel, "Branches", n.children.length + "");
          const ul = el("ul", "branches");
          n.children.forEach((body, i) => {
            const li = el("li");
            const l = n.branchLabels[i];
            text(li, "code", "", isElse(l) ? otherwise(n) : l);
            const steps = body.length
              ? body.length + (body.length === 1 ? " step" : " steps")
              : "no steps";
            text(li, "span", "", steps);
            if (n.branchExits?.[i])
              text(li, "code", "", action(n, i) || "leaves");
            ul.append(li);
          });
          if (!n.branchLabels.some(isElse)) {
            const li = el("li");
            text(li, "code", "", otherwise(n));
            text(li, "span", "", "continues");
            ul.append(li);
          }
          s.append(ul);
        }
        if (isGuard(n))
          text(
            panel,
            "div",
            "hint",
            "When this is true the body leaves with " +
              (action(n, 0) || "an exit") +
              "; else the flow continues below.",
          );
        if (n.context) {
          const ctx = section(
            panel,
            n.kind === "Set" || n.kind === "SetJSON"
              ? "Context after this write"
              : "Context shape",
          );
          typeToggle(ctx);
          if (data.diagnostics.length)
            text(
              ctx,
              "div",
              "warning",
              data.diagnostics.length +
                " analysis gaps may hide other context effects; see the notes below.",
            );
          if (n.context.some((f) => f.dynamic))
            text(
              ctx,
              "div",
              "warning",
              "This key is computed when the workflow runs. Writing a key twice in the same scope causes an error.",
            );
          const tree = el("div", "shape");
          for (const f of n.context) {
            const item = el("div", "context-entry");
            shape(item, f.shape, f.dynamic ? "[" + f.key + "]" : f.key, true);
            const row = el("div", "origin-row");
            if (f.scope !== n.scope)
              text(row, "span", "status", "inherited");
            if (f.optional) text(row, "span", "status", "conditional");
            if (n.context.filter((x) => x.key === f.key).length > 1)
              text(row, "span", "status", "one of several");
            origin(row, f.write);
            if (f.when) {
              text(row, "span", "", "when");
              text(row, "code", "", f.when);
            }
            if (f.shadowed?.length) {
              text(row, "span", "", "· shadows");
              for (const id of f.shadowed) origin(row, id);
            }
            item.append(row);
            tree.append(item);
          }
          ctx.append(tree);
          if (n.context.some((f) => hasOptionalField(f.shape)))
            text(ctx, "div", "hint shape-legend", "? optional field · ↩ refers to an enclosing shape");
          if (!n.context.length)
            text(ctx, "div", "hint", "Nothing has been written to context yet.");
        }
        const code = n.control?.code || n.detail?.expression;
        const source = section(panel, "Go source");
        if (code) text(source, "pre", "code", code);
        text(
          source,
          "div",
          "hint",
          n.source.file + ":" + n.source.line,
        );
        notes(panel);
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") overview();
      });
      requestAnimationFrame(() => {
        drawEdges();
        overview();
      });
      new ResizeObserver(drawEdges).observe(
        document.getElementById("graph-body"),
      );
    </script>
  </body>
</html>
