# IMPORTANT FOR AI AGENTS:
# These linters use DEFAULT configurations. There are no .golangci.yml or
# other config files, and that is intentional. If a linter fails, fix the
# code - do NOT create config files, add nolint directives, or disable
# linters to make the check pass. The defaults are the standard.

# Preserve advisory warnings even when the hook exits successfully.
output:
  - meta
  - summary
  - failure
  - execution
  - execution_out

pre-commit:
  follow: true
  jobs:
    # Mandatory index checks precede uncached Go/frontend/release smoke tests.
    # Slow smoke tests warn and stop; actual failures block. Never auto-stage.
    - name: bounded-commit-checks
      run: bash scripts/pre-commit.sh

commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-message.sh "{1}"
