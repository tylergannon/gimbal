# IMPORTANT FOR AI AGENTS:
# These linters use DEFAULT configurations. There are no .golangci.yml or
# other config files, and that is intentional. If a linter fails, fix the
# code - do NOT create config files, add nolint directives, or disable
# linters to make the check pass. The defaults are the standard.

pre-commit:
  jobs:
    - name: staged-content-policy
      run: bash scripts/check-staged-content.sh

    - name: staged-whitespace
      run: git diff --cached --check

    # Read the index, never rewrite or stage working-tree files. No builds,
    # repository-wide analysis, dependencies, or tests run during commit/push.
    - name: staged-go-format
      run: bash scripts/check-staged-format.sh
